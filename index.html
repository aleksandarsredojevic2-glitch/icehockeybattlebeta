<!DOCTYPE html>
<html lang="sr">
<head>
    <meta charset="UTF-8">
    <title>IHB Ice Hockey 5v5</title>
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    overflow: hidden !important;
    position: fixed;
    touch-action: none; /* Sprečava zoom i scroll na mobilnom */
}

canvas {
    display: block;
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
}
#game-ui {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 10;
    pointer-events: none; /* Da klikovi prolaze kroz UI do canvasa ako treba */
}

/* Osiguraj da svi ekrani budu preko celog ekrana */
#screen-login, #screen-rooms, #screen-lobby {
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    pointer-events: auto; /* Da klikovi rade na dugmićima */
}
#screen-lobby {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding-top: 50px;
    display: flex;
    flex-direction: column;
    align-items: center;
    background-image: url('sobe.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}
/* Definiše stubove (kolone) za timove */
.team-column {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 180px;
}

.team-column button {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
    cursor: pointer;
}

.team-column ul {
    list-style-type: none;
    padding: 0 !important;
    margin: 0;
    width: 100%;
    text-align: center;
}

.team-column li {
    width: 100%;
    padding: 5px 0;
    color: black;
    font-family: sans-serif;
    font-weight: bold;
}
#screen-rooms {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    align-items: center;
    padding-top: 40px;
    gap: 20px;

    background-image: url('room.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    z-index: 5;
}
#room-list-container {
    display: flex;
    flex-direction: column;
    gap: 10px;
    max-height: 60vh;
    overflow-y: auto;
    width: 340px;
}
.room-entry {
    background: rgba(255,255,255,0.85);
    padding: 10px 14px;
    border-radius: 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: sans-serif;
    font-weight: bold;
    color: #1a1a1a;
}
.room-entry button {
    padding: 6px 14px;
    cursor: pointer;
    border-radius: 4px;
    border: none;
    background: #4d94ff;
    color: white;
    font-weight: bold;
}
#chatInputContainer {
    position: absolute;
    bottom: 3px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 101;
    width: 620px;
}

#chatInput {
    width: 100%;
    padding: 1px;
    border-radius: 3px;
    border: none;
    outline: none;
    background: #9EACB880;
    color: grey;
    box-sizing: border-box;
}
#screen-login {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    margin: 0;
    padding: 0;

    display: flex;
    flex-direction: row;
    justify-content: center;

    padding-top: 70vh;
    align-items: flex-start;

    background-image: url('lobby.png');
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    gap: 2px;
}
    </style>
</head>
<body>
    <div id="game-ui">
        <div id="screen-login">
            <input type="text" id="nameInput" placeholder="Enter a nickname...">
            <button onclick="goToRoomScreen()">Continue</button>
        </div>

        <div id="screen-rooms" style="display: none;">
            <h2 style="color: black;">Room list</h2>
            <button onclick="createNewRoom()">Create new room</button>
            <div id="room-list-container"></div>
        </div>

        <div id="screen-lobby" style="display: none; background: rgba(0,0,0,0.6);">

            <h1 style="color: white; margin-bottom: 30px;">LOBBY</h1>

            <div style="display: flex; gap: 40px; justify-content: center;">

                <!-- RED -->
                <div class="team-column">
                    <button onclick="changeTeam('red')">RED</button>
                    <ul id="list-red"></ul>
                </div>

                <!-- SPECTATE -->
                <div class="team-column">
                    <button onclick="changeTeam('spectator')">SPECTATE</button>
                    <ul id="list-spectators"></ul>
                </div>

                <!-- BLUE -->
                <div class="team-column">
                    <button onclick="changeTeam('blue')">BLUE</button>
                    <ul id="list-blue"></ul>
                </div>
            </div>

            <button id="start-btn" onclick="sendStart()" style="margin-top: 40px; display: none;">START GAME</button>

        </div>
    </div>
    <canvas id="hockeyCanvas"></canvas>
<div id="chatBox" style="
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    width: 600px;
    height: 100px;
    background: #9EACB860;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: grey;
    overflow-y: auto;
    padding: 10px;
    border-radius: 12px;
    display: none;
    z-index: 9999;
    font-size: 14px;
    font-family: sans-serif;">
</div>
<div id="chatInputContainer" style="display: none;">
    <input type="text" id="chatInput" placeholder="Press Enter for chat...">
</div>
<script>
const canvas = document.getElementById("hockeyCanvas");
const ctx = canvas.getContext("2d");
const host = window.location.hostname;
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const port = window.location.port ? `:${window.location.port}` : '';

const wsUrl = host === 'localhost' ? 'ws://localhost:3000' : `wss://icehockeybattlebeta.onrender.com`;

const socket = new WebSocket(wsUrl);

let puck = { x: 1500, y: 750 };
let players = {};
let myId = null;
let currentScore = { teamRed: 0, teamBlue: 0 };
const WORLD_WIDTH = 3000;
const WORLD_HEIGHT = 1500;
// MORA biti identično sa server.js!
const ICE_WIDTH = 2600;
const ICE_HEIGHT = 1200;
let iceScratches = [];

function getSpecs() {
    const startX = (WORLD_WIDTH - ICE_WIDTH) / 2;
    const startY = (WORLD_HEIGHT - ICE_HEIGHT) / 2;
    return { scale: 1, left: startX, right: startX + ICE_WIDTH, top: startY, bottom: startY + ICE_HEIGHT, cornerRadius: 160, goalLineLeft: startX + ICE_WIDTH * 0.07, goalLineRight: startX + ICE_WIDTH * 0.93, faceoffR: ICE_HEIGHT * 0.13, goal: { w: ICE_WIDTH * 0.025, h: ICE_HEIGHT * 0.15, y: startY + (ICE_HEIGHT/2) - (ICE_HEIGHT * 0.15 / 2), creaseR: (ICE_HEIGHT * 0.15) * 0.55 } };
}
function showChat() {
    document.getElementById('chatInputContainer').style.display = 'block';
    document.getElementById('chatBox').style.display = 'block';
}
function drawScore() {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);

    const w = 400;
    const h = 50;
    const x = canvas.width / 2 - w / 2;
    const y = 0.5;
    const lineW = 6;

    ctx.fillStyle = "#ff4d4d";
    ctx.fillRect(x, y, lineW, h);

    ctx.fillStyle = "blue";
    ctx.fillRect(x + w - lineW, y, lineW, h);

    const secW = (w - (2 * lineW)) / 3;
    const startX = x + lineW;

    ctx.fillStyle = "#61616180";
    ctx.fillRect(startX, y, secW, h);

    ctx.fillStyle = "#A6A6A650";
    ctx.fillRect(startX + secW, y, secW, h);

    ctx.fillStyle = "#61616180";
    ctx.fillRect(startX + 2 * secW, y, secW, h);

    ctx.font = "bold 22px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillStyle = "white";

    ctx.fillText("HOME", startX + secW/2, y + h/2);
    ctx.fillStyle = "#1a1a1a";
    ctx.fillText(`${currentScore.teamRed} - ${currentScore.teamBlue}`, startX + secW + secW/2, y + h/2);
    ctx.fillStyle = "white";
    ctx.fillText("AWAY", startX + 2 * secW + secW/2, y + h/2);

    ctx.restore();
}

function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

// --- HELPER: prikaz jednog ekrana, sakrivanje ostalih ---
function showScreen(id) {
    ['screen-login', 'screen-rooms', 'screen-lobby'].forEach(s => {
        document.getElementById(s).style.display = (s === id) ? 'flex' : 'none';
    });
}

function renderRoomList(roomList) {
    const container = document.getElementById('room-list-container');
    container.innerHTML = "";
    if (!roomList || roomList.length === 0) {
        container.innerHTML = "<p style='color:white; text-align:center;'>Nema aktivnih soba. Napravi novu!</p>";
        return;
    }
    roomList.forEach(room => {
        const div = document.createElement('div');
        div.className = 'room-entry';
        div.innerHTML = `<span>Soba ${room.id} — ${room.playerCount} igrača (${room.gameState})</span>`;
        const btn = document.createElement('button');
        btn.innerText = "JOIN";
        btn.onclick = () => joinExistingRoom(room.id);
        div.appendChild(btn);
        container.appendChild(div);
    });
}

function joinExistingRoom(roomId) {
    const nick = document.getElementById('nameInput').value || "Guest";
    socket.send(JSON.stringify({ type: 'join-room', room: roomId, name: nick }));
    showScreen('screen-lobby');
}

// --- 1. SOCKET PORUKE ---
socket.onmessage = (event) => {
    const data = JSON.parse(event.data);

    if (data.type === 'welcome') myId = data.myId;

    if (data.type === 'room-list') {
        renderRoomList(data.rooms);
    }

    if (data.type === 'room-created') {
        socket.send(JSON.stringify({ type: 'join-room', room: data.roomId, name: document.getElementById('nameInput').value }));
        showScreen('screen-lobby');
    }

    if (data.type === 'game-started') {
        showScreen(null); // sakrij sve menije
        showChat();
    }

    if (data.type === 'game-over') {
        alert("Pobednik: " + data.winner);
        document.getElementById('chatBox').style.display = 'none';
        document.getElementById('chatInputContainer').style.display = 'none';
        showScreen('screen-lobby');
    }

    if (data.type === 'chat') {
        const chatBox = document.getElementById('chatBox');
        const msg = document.createElement('div');
        const senderName = players[data.senderId] ? players[data.senderId].name : "Nepoznat";
        msg.innerHTML = `<b>${senderName}:</b> ${data.text}`;
        chatBox.appendChild(msg);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    if (data.type === 'update') {
        puck.x = data.puck.x; puck.y = data.puck.y;
        players = data.players;
        currentScore = data.score;

        const startBtn = document.getElementById('start-btn');
        if (startBtn) startBtn.style.display = (data.adminId === myId) ? "block" : "none";

        const listRed = document.getElementById('list-red');
        const listBlue = document.getElementById('list-blue');
        const listSpec = document.getElementById('list-spectators');

        listRed.innerHTML = "";
        listBlue.innerHTML = "";
        listSpec.innerHTML = "";

        Object.values(players).forEach(p => {
            let li = document.createElement('li');
            li.innerText = p.name;
            if (p.team === 'red') listRed.appendChild(li);
            else if (p.team === 'blue') listBlue.appendChild(li);
            else listSpec.appendChild(li);
        });
    }
}

// --- 2. NAVIGACIJA ---

function drawVectorField() {
    const s = getSpecs(); const g = s.goal;

    ctx.fillStyle = "#1F232B";
    ctx.fillRect(0, 0, WORLD_WIDTH, WORLD_HEIGHT);

    ctx.beginPath();
    ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5);
    ctx.lineTo(s.right - s.cornerRadius, s.top);
    ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0);
    ctx.lineTo(s.right, s.bottom - s.cornerRadius);
    ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5);
    ctx.lineTo(s.left + s.cornerRadius, s.bottom);
    ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI);
    ctx.closePath();

    let iceGrad = ctx.createRadialGradient(WORLD_WIDTH/2, WORLD_HEIGHT/2, 50, WORLD_WIDTH/2, WORLD_HEIGHT/2, WORLD_WIDTH * 0.6);
    iceGrad.addColorStop(0, "#fafcff"); iceGrad.addColorStop(1, "#e5edf5");
    ctx.fillStyle = iceGrad; ctx.fill();

    iceScratches.forEach(sc => {
        ctx.strokeStyle = `rgba(220, 230, 242, ${sc.alpha})`; ctx.lineWidth = 1; ctx.beginPath();
        let sx = s.left + sc.x * (s.right - s.left); let sy = s.top + sc.y * (s.bottom - s.top);
        ctx.moveTo(sx, sy); ctx.lineTo(sx + Math.cos(sc.angle)*sc.len, sy + Math.sin(sc.angle)*sc.len); ctx.stroke();
    });

    ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 5 * s.scale;
    ctx.beginPath(); ctx.moveTo(WORLD_WIDTH / 2, s.top); ctx.lineTo(WORLD_WIDTH / 2, s.bottom); ctx.stroke();
    ctx.beginPath();
    ctx.arc(WORLD_WIDTH / 2, WORLD_HEIGHT / 2, 120 * s.scale, 0, 2 * Math.PI);
    ctx.strokeStyle = "rgba(60, 60, 230, 0.5)";
    ctx.lineWidth = 5 * s.scale;
    ctx.stroke();
    ctx.strokeStyle = "rgba(60, 60, 230, 0.5)"; ctx.lineWidth = 6 * s.scale;
    ctx.beginPath();
    ctx.moveTo(s.left + (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.left + (s.right - s.left) * 0.36, s.bottom);
    ctx.moveTo(s.right - (s.right - s.left) * 0.36, s.top); ctx.lineTo(s.right - (s.right - s.left) * 0.36, s.bottom);
    ctx.stroke();

    ctx.strokeStyle = "rgba(230, 60, 60, 0.6)"; ctx.lineWidth = 3 * s.scale;
    ctx.beginPath(); ctx.moveTo(s.goalLineLeft, s.top + 5); ctx.lineTo(s.goalLineLeft, s.bottom - 5);
    ctx.moveTo(s.goalLineRight, s.top + 5); ctx.lineTo(s.goalLineRight, s.bottom - 5); ctx.stroke();

    ctx.strokeStyle = "rgba(60, 150, 230, 0.6)"; ctx.lineWidth = 2.5 * s.scale; ctx.fillStyle = "rgba(180, 220, 255, 0.25)";
    ctx.beginPath(); ctx.arc(s.goalLineLeft, WORLD_HEIGHT / 2, g.creaseR, -Math.PI/2, Math.PI/2); ctx.fill(); ctx.stroke();
    ctx.beginPath(); ctx.arc(s.goalLineRight, WORLD_HEIGHT / 2, g.creaseR, Math.PI/2, -Math.PI/2); ctx.fill(); ctx.stroke();

    ctx.beginPath(); ctx.arc(WORLD_WIDTH / 2, s.bottom, 22 * s.scale, Math.PI, 0); ctx.stroke();

    const circlesX = [s.left + (s.goalLineLeft - s.left) * 2.8, s.right - (s.right - s.goalLineRight) * 2.8];
    const circlesY = [s.top + s.faceoffR * 1.25, s.bottom - s.faceoffR * 1.25];
    circlesX.forEach(cx => { circlesY.forEach(cy => {
        ctx.strokeStyle = "rgba(230, 60, 60, 0.45)"; ctx.lineWidth = 2 * s.scale; ctx.fillStyle = "rgba(230, 60, 60, 0.65)";
        ctx.beginPath(); ctx.arc(cx, cy, s.faceoffR, 0, Math.PI * 2); ctx.stroke();
        ctx.beginPath(); ctx.arc(cx, cy, 4 * s.scale, 0, Math.PI * 2); ctx.fill();
    });});

    ctx.fillStyle = "rgba(50, 90, 140, 0.15)";
    ctx.font = `bold ${Math.floor(47 * s.scale)}px Arial`;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("IHB", WORLD_WIDTH / 2, (WORLD_HEIGHT / 2) +4) ;

    ctx.lineWidth = 3.5 * s.scale; ctx.fillStyle = "rgba(240, 240, 250, 0.25)"; ctx.strokeStyle = "#de2f2f";
    ctx.beginPath(); ctx.moveTo(s.goalLineLeft, g.y); ctx.lineTo(s.goalLineLeft - g.w + 10*s.scale, g.y); ctx.arcTo(s.goalLineLeft - g.w, g.y, s.goalLineLeft - g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineLeft - g.w, g.y + g.h, s.goalLineLeft - g.w + 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineLeft, g.y + g.h); ctx.fill(); ctx.stroke();
    ctx.lineWidth = 3.5 * s.scale; ctx.strokeStyle = "#de2f2f"; ctx.fillStyle = "rgba(240, 240, 250, 0.25)";
    ctx.beginPath(); ctx.moveTo(s.goalLineRight, g.y); ctx.lineTo(s.goalLineRight + g.w - 10*s.scale, g.y); ctx.arcTo(s.goalLineRight + g.w, g.y, s.goalLineRight + g.w, g.y + g.h/2, 10*s.scale); ctx.arcTo(s.goalLineRight + g.w, g.y + g.h, s.goalLineRight + g.w - 10*s.scale, g.y + g.h, 10*s.scale); ctx.lineTo(s.goalLineRight, g.y + g.h); ctx.fill(); ctx.stroke();

    ctx.strokeStyle = "#334155"; ctx.lineWidth = 7 * s.scale;
    ctx.beginPath(); ctx.arc(s.left + s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI, Math.PI * 1.5); ctx.lineTo(s.right - s.cornerRadius, s.top); ctx.arc(s.right - s.cornerRadius, s.top + s.cornerRadius, s.cornerRadius, Math.PI * 1.5, 0); ctx.lineTo(s.right, s.bottom - s.cornerRadius); ctx.arc(s.right - s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, 0, Math.PI * 0.5); ctx.lineTo(s.left + s.cornerRadius, s.bottom); ctx.arc(s.left + s.cornerRadius, s.bottom - s.cornerRadius, s.cornerRadius, Math.PI * 0.5, Math.PI); ctx.closePath(); ctx.stroke();
}

function goToRoomScreen() {
    const nick = document.getElementById('nameInput').value;
    if (!nick) return alert("Unesi ime!");
    showScreen('screen-rooms');
    socket.send(JSON.stringify({ type: 'list-rooms' }));
}
function changeTeam(team) {
    const nick = document.getElementById('nameInput').value || "Guest";
    socket.send(JSON.stringify({ type: 'set-team', team: team, name: nick }));
}

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
function createNewRoom() {
    socket.send(JSON.stringify({ type: 'create-room' }));
}

function sendStart() {
    socket.send(JSON.stringify({ type: 'start-game' }));
}
document.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
        if (document.activeElement === chatInput) {
            const text = chatInput.value.trim();
            if (text !== "") {
                socket.send(JSON.stringify({ type: 'chat', text: text }));
                chatInput.value = "";
            }
            chatInput.blur();
        } else {
            document.getElementById('chatBox').style.display = 'block';
            document.getElementById('chatInputContainer').style.display = 'block';
            chatInput.focus();
        }
    }
});

// --- 3. RENDEROVANJE ---
function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (document.getElementById('screen-login').style.display !== 'none' ||
        document.getElementById('screen-rooms').style.display !== 'none' ||
        document.getElementById('screen-lobby').style.display !== 'none') {

        requestAnimationFrame(draw);
        return;
    }

    let me = players[myId];

    let targetX = me ? me.x : WORLD_WIDTH / 2;
    let targetY = me ? me.y : WORLD_HEIGHT / 2;

    let camX = targetX - canvas.width / 2;
    let camY = targetY - canvas.height / 2;

    camX = Math.max(0, Math.min(camX, WORLD_WIDTH - canvas.width));
    camY = Math.max(0, Math.min(camY, WORLD_HEIGHT - canvas.height));

    ctx.save();
    ctx.translate(-camX, -camY);

    drawVectorField();

    ctx.fillStyle = "#1a1a1a";
    ctx.beginPath(); ctx.arc(puck.x, puck.y, 6, 0, Math.PI * 2); ctx.fill();

    for (let id in players) {
        let p = players[id];

        ctx.fillStyle = (p.team === 'red') ? "#FF4A4A" : "#4d94ff";
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "black";
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 16, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "black";
        ctx.font = "bold 14px Arial";
        ctx.textAlign = "center";
        ctx.fillText(p.name, p.x, p.y - 28);
        if (p.chatMessage) {
            ctx.fillStyle = "rgba(0, 0, 0)";
            ctx.fillRect(p.x - 60, p.y - 70, 120, 30);

            ctx.fillStyle = "black";
            ctx.font = "12px Arial";
            ctx.textAlign = "center";
            ctx.fillText(p.chatMessage, p.x, p.y - 50);
        }
    }

    ctx.restore();

    drawScore();

    requestAnimationFrame(draw);
}
let keys = {};

window.addEventListener("keydown", (e) => {
    if (document.activeElement.id === 'chatInput') return;
    if (e.code === 'Space' || e.code === 'KeyX') {
        socket.send(JSON.stringify({ type: 'shoot' }));
        return;
    }
    if (keys[e.code]) return;
    keys[e.code] = true;
    socket.send(JSON.stringify({ type: 'key-down', key: e.code }));
});

window.addEventListener("keyup", (e) => {
    keys[e.code] = false;
    socket.send(JSON.stringify({ type: 'key-up', key: e.code }));
});

resize();
draw();

</script>
</body>
</html>
